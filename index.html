<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Install</title>
  <!-- Link fixo obrigatório para o navegador reativar o botão de instalação -->
  <link rel="manifest" href="manifest.json">
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: sans-serif;
      background-color: white;
      color: #333;
    }
    h1 { margin-bottom: 10px; }
  </style>
</head>
<body>

  <h1>Install this app!</h1>
  <p>Click in the download button in the URL bar (chrome)<br>Click in + then, add at homescreen (samsung browser)<br>Click in the install button in the message that may appear in the screen. (other browsers)</p>

  <script>
    // Função pura: Extrai o código da URL (tentando parâmetro de busca ou o Hash fragment #)
    function checarURLEExecutar() {
      const urlParams = new URLSearchParams(window.location.search);
      let codeValue = urlParams.get('code');

      // Se a busca estiver vazia (reabertura do app), extrai o código diretamente do hash '#'
      if (!codeValue && window.location.hash) {
        // Remove o caractere '#' do início e decodifica a string da URL
        codeValue = decodeURIComponent(window.location.hash.substring(1));
      }

      if (codeValue) {
        try {
          const base64Encoded = btoa(unescape(encodeURIComponent(codeValue)));
          window.location.href = "https://nbc-nu.github.io/n.u.-apps/?c=" + base64Encoded;
        } catch (error) {
          console.error("Error:", error);
          window.location.href = 'https://nbc-nu.github.io/n.u.-apps/';
        }
      } else {
        window.location.href = 'https://nbc-nu.github.io/n.u.-apps/';
      }
    }

    // 1. Verificação se JÁ ABRIU dentro do PWA instalado
    const queryPWA = window.matchMedia('(display-mode: standalone)');
    if (queryPWA.matches || window.navigator.standalone) {
      checarURLEExecutar();
    }

    // 2. Ouvinte dinâmico se o modo mudar com a página aberta
    queryPWA.addEventListener('change', (e) => {
      if (e.matches) {
        checarURLEExecutar();
      }
    });

    // 3. Ouvinte disparado na hora exata do clique de instalação
    window.addEventListener('appinstalled', () => {
      setTimeout(checarURLEExecutar, 500);
    });

    // Registro do Service Worker obrigatório
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js');
      });
    }
  </script>
</body>
</html>
