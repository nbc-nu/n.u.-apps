<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loading...</title>
    <script>
        window.addEventListener('DOMContentLoaded', () => {

            const urlParams = new URLSearchParams(window.location.search);
            const codeValue = urlParams.get('code');

            if (codeValue) {
                try {

                    const base64Encoded = btoa(unescape(encodeURIComponent(codeValue)));


                    const targetUrl = "https://nbc-nu.github.io/n.u.-apps/view?c=" + base64Encoded;


                    window.location.href = targetUrl;
                } catch (error) {
                    console.error("Error:", error);
                    document.body.innerText = "Error: REDIRECT_NOT_WORKING";
                }
            } else {
                document.body.innerText = "Error: NO_CODE";
            }
        });
    </script>
</head>
<body>
</body>
</html>
